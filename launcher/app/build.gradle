plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bbu.sbl'
    compileSdk 34

    defaultConfig {
        applicationId 'com.bbu.sbl'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '0.1'
    }

    // The APK is called SlightlyBetterLauncher.apk whatever the build type.
    applicationVariants.all { variant ->
        variant.outputs.all { outputFileName = 'SlightlyBetterLauncher.apk' }
    }

    // Release signing: launcher/keystore.properties (never committed) names the key. Without it the release build
    // is signed with the debug key, so anyone can still build and sideload it.
    def keystoreProps = new Properties()
    def keystoreFile = rootProject.file('keystore.properties')
    if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
